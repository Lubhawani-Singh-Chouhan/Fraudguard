spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: inject-transaction
          uri: ${CONSUMER_URI:http://localhost:8081}
          predicates:
            - Path=/transactions
            - Method=POST
          filters:
            - RewritePath=/transactions, /api/transactions
        - id: transaction-score
          uri: ${CONSUMER_URI:http://localhost:8081}
          predicates:
            - Path=/transactions/*/score
            - Method=GET
          filters:
            - RewritePath=/transactions/(?<id>[^/]+)/score, /api/transactions/$\{id}
        - id: alerts
          uri: ${CONSUMER_URI:http://localhost:8081}
          predicates:
            - Path=/alerts
            - Method=GET
          filters:
            - RewritePath=/alerts,/api/alerts

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
