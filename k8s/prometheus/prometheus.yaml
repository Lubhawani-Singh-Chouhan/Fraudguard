apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fraudguard
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: gateway-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["gateway-service:8080"]
      - job_name: consumer-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["consumer-service:8081"]
      - job_name: scoring-service
        metrics_path: /metrics
        static_configs:
          - targets: ["scoring-service:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fraudguard
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
