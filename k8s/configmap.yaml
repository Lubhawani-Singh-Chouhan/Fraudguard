apiVersion: v1
kind: ConfigMap
metadata:
  name: fraudguard-config
  namespace: fraudguard
data:
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  POSTGRES_HOST: postgres
  POSTGRES_DB: fraudguard
  SCORING_BASE_URL: http://scoring-service:8000
  CONSUMER_URI: http://consumer-service:8081
  FRAUD_ALERT_THRESHOLD: "0.70"
  SCORING_MODE: rules
  TX_RATE_PER_SEC: "20"
