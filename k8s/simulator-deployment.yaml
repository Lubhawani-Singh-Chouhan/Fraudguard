apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-simulator
  namespace: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-simulator
  template:
    metadata:
      labels:
        app: transaction-simulator
    spec:
      containers:
        - name: transaction-simulator
          image: fraudguard/transaction-simulator:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: KAFKA_BOOTSTRAP
            - name: TX_RATE_PER_SEC
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: TX_RATE_PER_SEC
            - name: KAFKA_TOPIC
              value: transactions
            - name: FRAUD_RATIO
              value: "0.08"
