apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-service
  namespace: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-service
  template:
    metadata:
      labels:
        app: consumer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: consumer-service
          image: fraudguard/consumer-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: KAFKA_BOOTSTRAP
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: REDIS_HOST
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/fraudguard
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fraudguard-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudguard-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SCORING_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: SCORING_BASE_URL
            - name: FRAUD_ALERT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: fraudguard-config
                  key: FRAUD_ALERT_THRESHOLD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-service
  namespace: fraudguard
spec:
  selector:
    app: consumer-service
  ports:
    - port: 8081
      targetPort: 8081
