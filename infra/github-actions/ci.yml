name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  consumer-service:
    name: consumer-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/consumer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Test + package
        run: mvn -B test package

  scoring-service:
    name: scoring-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scoring-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q
